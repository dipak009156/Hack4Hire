server:
  port: 8080

spring:
  application:
    name: quantum-lock
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quantumlock}
    username: ${SPRING_DATASOURCE_USERNAME:qluser}
    password: ${SPRING_DATASOURCE_PASSWORD:qlpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

jwt:
  secret: a-very-long-dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256
  expiration-ms: 3600000

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:quantum-lock-docs}

kms:
  current-version: 1
  fault-enabled: false
  keys:
    1: "u7x8Q4z+1vP3mN9kL2jH5gF8dE1cA4bZ7yX0wV3uT6s="
    2: "p2O5r8U1y4A7d0G3j6M9p2S5v8Y1b4E7h0K3n6Q9t2W="
    3: "e3H6k9N2q5T8w1Z4c7F0i3L6o9R2u5X8a1D4g7J0m3P="

policy:
  max-staleness-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      minio:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      kms:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      broker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      minio:
        max-attempts: 3
        wait-duration: 500ms
      broker:
        max-attempts: 3
        wait-duration: 500ms

outbox:
  relay-interval-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.quantumlock: DEBUG
